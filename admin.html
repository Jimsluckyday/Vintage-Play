<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Vintage Play Collectibles</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <div id="loginView" class="admin-box">
    <h2>Admin Login</h2>
    <label for="loginEmail">Email</label>
    <input type="email" id="loginEmail" autocomplete="username" />
    <label for="loginPassword">Password</label>
    <input type="password" id="loginPassword" autocomplete="current-password" />
    <button class="btn" id="loginBtn">Log In</button>
    <p class="error-text" id="loginError" hidden></p>
  </div>

  <div id="adminView" hidden>
    <div class="top-bar">
      <h1 style="font-size:1.2rem;margin:0;">Vintage Play Collectibles — Admin</h1>
      <button class="btn secondary" id="logoutBtn">Log Out</button>
    </div>

    <div class="section">
      <h2>Categories</h2>
      <div class="btn-row">
        <input type="text" id="newCategoryLabel" placeholder="e.g. Books" style="max-width:250px;" />
        <button class="btn secondary" id="addCategoryBtn" style="margin-top:0;">Add Category</button>
      </div>
      <p class="error-text" id="categoryError" hidden></p>
    </div>

    <div class="section">
      <h2 id="formTitle">Add New Item</h2>
      <label for="title">Title</label>
      <input type="text" id="title" />

      <label for="category">Category</label>
      <select id="category"></select>
      <p class="hint">Don't see the category you need? Add one below, then it'll appear in this list.</p>

      <label for="condition_notes">Condition Notes</label>
      <textarea id="condition_notes" rows="2"></textarea>

      <label for="description">Description (extra details, backstory, what's included)</label>
      <textarea id="description" rows="4"></textarea>

      <label for="cost_basis">Cost Basis ($)</label>
      <input type="number" step="0.01" id="cost_basis" />

      <label for="asking_price">Asking Price ($)</label>
      <input type="number" step="0.01" id="asking_price" />

      <label for="quantity">Quantity</label>
      <input type="number" step="1" min="1" id="quantity" value="1" />

      <label for="status">Status</label>
      <select id="status">
        <option value="available">Available</option>
        <option value="pending">Pending</option>
        <option value="sold">Sold</option>
      </select>

      <label for="photos">Photos (you can select multiple)</label>
      <input type="file" id="photos" accept="image/*" multiple />
      <p class="hint" id="existingPhotosNote"></p>

      <div class="btn-row">
        <button class="btn" id="saveBtn">Save Item</button>
        <button class="btn secondary" id="cancelEditBtn" hidden>Cancel Edit</button>
      </div>
      <p class="error-text" id="formError" hidden></p>
    </div>

    <div class="section">
      <h2>Inventory (<span id="itemCount">0</span>)</h2>
      <div id="itemList"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/config.js"></script>
  <script>
    let items = [];
    let editingId = null;

    const loginView = document.getElementById("loginView");
    const adminView = document.getElementById("adminView");

    function populateCategorySelect() {
      const select = document.getElementById("category");
      const previousValue = select.value;
      select.innerHTML = ALL_CATEGORIES.map(
        (c) => `<option value="${c.slug}">${c.label}</option>`
      ).join("");
      if (previousValue) select.value = previousValue;
    }

    document.getElementById("addCategoryBtn").addEventListener("click", async () => {
      const input = document.getElementById("newCategoryLabel");
      const errorEl = document.getElementById("categoryError");
      errorEl.hidden = true;

      const label = input.value.trim();
      if (!label) return;
      const slug = slugify(label);

      const { error } = await supabaseClient.from("categories").insert({ slug, label });
      if (error) {
        errorEl.textContent = error.message;
        errorEl.hidden = false;
        return;
      }
      input.value = "";
      await loadCategories();
      populateCategorySelect();
    });

    async function checkSession() {
      await loadCategories();
      populateCategorySelect();
      const { data } = await supabaseClient.auth.getSession();
      if (data.session) {
        showAdmin();
      } else {
        showLogin();
      }
    }

    function showLogin() {
      loginView.hidden = false;
      adminView.hidden = true;
    }

    function showAdmin() {
      loginView.hidden = true;
      adminView.hidden = false;
      loadItems();
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const errorEl = document.getElementById("loginError");
      errorEl.hidden = true;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorEl.textContent = error.message;
        errorEl.hidden = false;
        return;
      }
      showAdmin();
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      showLogin();
    });

    async function loadItems() {
      const { data, error } = await supabaseClient
        .from("items")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        document.getElementById("itemList").innerHTML = `<p class="error-text">Couldn't load items: ${error.message}</p>`;
        return;
      }
      items = data;
      renderItemList();
    }

    function renderItemList() {
      document.getElementById("itemCount").textContent = items.length;
      const listEl = document.getElementById("itemList");
      listEl.innerHTML = "";

      items.forEach((item) => {
        const row = document.createElement("div");
        row.className = "item-row";
        const photo = item.photo_urls && item.photo_urls[0];
        row.innerHTML = `
          ${photo ? `<img src="${photo}" alt="" />` : `<div class="no-photo" style="width:70px;height:70px;">No photo</div>`}
          <div class="info">
            <h4>${escapeHtml(item.title)} <span class="meta">(${categoryLabel(item.category)})</span></h4>
            <div class="meta">$${Number(item.asking_price).toFixed(2)} &middot; Qty ${item.quantity} &middot; ${item.status}</div>
            <div class="btn-row">
              <button class="btn secondary" data-action="edit" data-id="${item.id}">Edit</button>
              <button class="btn danger" data-action="delete" data-id="${item.id}">Delete</button>
              <button class="btn secondary" data-action="listing" data-id="${item.id}">Generate Listing Text</button>
            </div>
            <div class="listing-output" data-listing-for="${item.id}" hidden></div>
          </div>
        `;
        listEl.appendChild(row);
      });

      listEl.querySelectorAll('[data-action="edit"]').forEach((btn) =>
        btn.addEventListener("click", () => startEdit(btn.dataset.id))
      );
      listEl.querySelectorAll('[data-action="delete"]').forEach((btn) =>
        btn.addEventListener("click", () => deleteItem(btn.dataset.id))
      );
      listEl.querySelectorAll('[data-action="listing"]').forEach((btn) =>
        btn.addEventListener("click", () => toggleListing(btn.dataset.id))
      );
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    function startEdit(id) {
      const item = items.find((i) => i.id === id);
      if (!item) return;
      editingId = id;
      document.getElementById("formTitle").textContent = `Edit: ${item.title}`;
      document.getElementById("title").value = item.title || "";
      document.getElementById("category").value = item.category || "games";
      document.getElementById("condition_notes").value = item.condition_notes || "";
      document.getElementById("description").value = item.description || "";
      document.getElementById("cost_basis").value = item.cost_basis || "";
      document.getElementById("asking_price").value = item.asking_price || "";
      document.getElementById("quantity").value = item.quantity || 1;
      document.getElementById("status").value = item.status || "available";
      document.getElementById("photos").value = "";
      document.getElementById("existingPhotosNote").textContent =
        item.photo_urls && item.photo_urls.length
          ? `${item.photo_urls.length} existing photo(s). Selecting new photos below will replace them.`
          : "No existing photos.";
      document.getElementById("cancelEditBtn").hidden = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetForm() {
      editingId = null;
      document.getElementById("formTitle").textContent = "Add New Item";
      document.getElementById("title").value = "";
      document.getElementById("category").value = "games";
      document.getElementById("condition_notes").value = "";
      document.getElementById("description").value = "";
      document.getElementById("cost_basis").value = "";
      document.getElementById("asking_price").value = "";
      document.getElementById("quantity").value = 1;
      document.getElementById("status").value = "available";
      document.getElementById("photos").value = "";
      document.getElementById("existingPhotosNote").textContent = "";
      document.getElementById("cancelEditBtn").hidden = true;
    }

    document.getElementById("cancelEditBtn").addEventListener("click", resetForm);

    async function uploadPhotos(files) {
      const urls = [];
      for (const file of files) {
        const path = `${crypto.randomUUID()}/${file.name}`;
        const { error } = await supabaseClient.storage.from("item-photos").upload(path, file);
        if (error) throw error;
        const { data } = supabaseClient.storage.from("item-photos").getPublicUrl(path);
        urls.push(data.publicUrl);
      }
      return urls;
    }

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const errorEl = document.getElementById("formError");
      errorEl.hidden = true;

      const payload = {
        title: document.getElementById("title").value.trim(),
        category: document.getElementById("category").value,
        condition_notes: document.getElementById("condition_notes").value.trim(),
        description: document.getElementById("description").value.trim(),
        cost_basis: parseFloat(document.getElementById("cost_basis").value) || null,
        asking_price: parseFloat(document.getElementById("asking_price").value) || null,
        quantity: parseInt(document.getElementById("quantity").value, 10) || 1,
        status: document.getElementById("status").value,
        updated_at: new Date().toISOString(),
      };

      if (!payload.title) {
        errorEl.textContent = "Title is required.";
        errorEl.hidden = false;
        return;
      }

      const fileInput = document.getElementById("photos");
      try {
        if (fileInput.files.length > 0) {
          payload.photo_urls = await uploadPhotos(fileInput.files);
        }

        if (editingId) {
          const { error } = await supabaseClient.from("items").update(payload).eq("id", editingId);
          if (error) throw error;
        } else {
          const { error } = await supabaseClient.from("items").insert(payload);
          if (error) throw error;
        }

        resetForm();
        await loadItems();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
      }
    });

    async function deleteItem(id) {
      if (!confirm("Delete this item? This can't be undone.")) return;
      const { error } = await supabaseClient.from("items").delete().eq("id", id);
      if (error) {
        alert(`Couldn't delete: ${error.message}`);
        return;
      }
      await loadItems();
    }

    function buildListingText(item) {
      const lines = [
        item.title,
        `Price: $${Number(item.asking_price).toFixed(2)}`,
        "",
        item.description || "",
        "",
        item.condition_notes ? `Condition: ${item.condition_notes}` : "",
        `Category: ${categoryLabel(item.category)}`,
        item.quantity > 1 ? `Quantity available: ${item.quantity}` : "",
        "",
        "Cash on pickup. Message me with any questions!",
      ];
      return lines.filter((l) => l !== "").join("\n");
    }

    function toggleListing(id) {
      const item = items.find((i) => i.id === id);
      const el = document.querySelector(`[data-listing-for="${id}"]`);
      if (!el) return;
      if (el.hidden) {
        el.textContent = buildListingText(item);
        el.hidden = false;
      } else {
        el.hidden = true;
      }
    }

    checkSession();
  </script>
</body>
</html>
