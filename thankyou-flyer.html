<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Thank-you flyers</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    /* Printable thank-you flyers: 6 to a letter page (2 across x 3 down), each 4.0 x 3.5 in, so one fits flat in a CD mailer.
       Open from the admin page with ?codes=THX-AAAAA,THX-BBBBB&pct=10&until=2027-01-24. With no codes it shows a SAMPLE. */
    :root { --ink: #2e2118; --ink-soft: #6b5a48; --brick: #c2452f; --mustard: #e2a63b; --teal: #2f7d78; --cream: #fffaf0; --dark: #241a12; }
    * { box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { margin: 0; background: #d9d9d9; font-family: 'Nunito', system-ui, sans-serif; color: var(--ink); }

    .toolbar { background: #fff; border-bottom: 1px solid #bbb; padding: 0.75rem 1rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .toolbar button { font: 800 1rem 'Nunito', sans-serif; background: var(--teal); color: #fff; border: 0; border-radius: 6px; padding: 0.55rem 1.1rem; cursor: pointer; }
    .toolbar p { margin: 0; font-size: 0.9rem; max-width: 46rem; }

    .sheet { width: 8.5in; height: 11in; margin: 0.4in auto; background: #fff; padding: 0.25in; display: grid;
             grid-template-columns: repeat(2, 4in); grid-template-rows: repeat(3, 3.5in); box-shadow: 0 2px 10px rgba(0,0,0,.3); page-break-after: always; break-after: page; }
    .sheet:last-child { page-break-after: auto; break-after: auto; }

    /* the dashed border is the cut line between flyers */
    .card { width: 4in; height: 3.5in; border: 0.75px dashed #9a9a9a; background: var(--cream); display: flex; flex-direction: column; overflow: hidden; }
    .band { background: var(--dark); height: 0.8in; display: flex; align-items: center; justify-content: space-between; padding: 0 0.2in; }
    .band img { height: 0.62in; width: auto; display: block; }
    .band .thx { font-family: 'Bangers', cursive; color: var(--mustard); font-size: 27pt; letter-spacing: 0.04em; line-height: 1; }
    .hello { text-align: center; font-weight: 700; font-size: 8pt; line-height: 1.3; padding: 0.1in 0.22in 0; color: var(--ink); }
    .coupon { margin: 0.09in 0.18in 0; border: 2px dashed var(--brick); border-radius: 0.1in; background: #fff; padding: 0.07in 0.1in; display: flex; align-items: center; gap: 0.1in; }
    .coupon .txt { flex: 1; text-align: center; }
    .off { font-family: 'Bangers', cursive; font-size: 30pt; line-height: 1; color: var(--brick); letter-spacing: 0.02em; }
    .next { font-weight: 800; font-size: 7.5pt; margin: 0.01in 0 0.05in; }
    .code { display: inline-block; font-family: 'Courier New', monospace; font-weight: 700; font-size: 15pt; letter-spacing: 0.07em; background: var(--dark); color: var(--mustard); border-radius: 0.05in; padding: 0.025in 0.09in; }
    .qr { width: 0.92in; text-align: center; font-size: 5.8pt; font-weight: 800; line-height: 1.15; }
    .qr svg { width: 0.92in; height: 0.92in; display: block; margin-bottom: 0.02in; }
    .fine { font-size: 5.8pt; line-height: 1.3; color: var(--ink-soft); text-align: center; padding: 0.05in 0.2in 0; }
    .foot { margin-top: auto; background: var(--teal); color: #fff; text-align: center; font-weight: 800; font-size: 9pt; letter-spacing: 0.03em; padding: 0.055in 0; }
    .sample { position: absolute; }

    @page { size: letter; margin: 0; }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .sheet { margin: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button type="button" onclick="window.print()">Print or save as PDF</button>
    <p id="help">In the print window pick <strong>Save as PDF</strong> (paper: Letter, margins: None) and upload that PDF to Staples. Ask them to print in colour and cut it into 6 flyers along the dashed lines.</p>
  </div>
  <div id="sheets"></div>

<script>
  const SITE = "https://www.vintageplay.ca";
  const params = new URLSearchParams(location.search);
  const isSample = !params.get("codes");
  const codes = isSample ? ["THX-SAMPLE"] : params.get("codes").split(",").map((c) => c.trim().toUpperCase()).filter(Boolean);
  const pct = Math.round(Number(params.get("pct")) || 10);
  const until = params.get("until");
  const untilText = until
    ? new Date(`${until}T12:00:00`).toLocaleDateString("en-CA", { month: "short", day: "numeric", year: "numeric" })
    : "";

  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  // QR code as plain SVG squares (no image files, prints sharp at any size)
  function qrSvg(text) {
    try {
      const qr = qrcode(0, "M");
      qr.addData(text);
      qr.make();
      const n = qr.getModuleCount();
      let path = "";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) path += `M${c} ${r}h1v1h-1z`;
      return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/><path d="${path}" fill="#2e2118"/></svg>`;
    } catch (e) {
      return "";
    }
  }

  function card(code) {
    const link = `${SITE}/?code=${encodeURIComponent(code)}`;
    return `
      <div class="card">
        <div class="band"><img src="logo.png" alt="Vintage Play Collectables" /><div class="thx">Thank You!</div></div>
        <div class="hello">Thanks for your order! We're a small independent shop in Brampton, Ontario selling games, movies, music, toys and collectables.</div>
        <div class="coupon">
          <div class="txt">
            <div class="off">${pct}% OFF</div>
            <div class="next">your next order at vintageplay.ca</div>
            <div class="code">${esc(code)}</div>
          </div>
          <div class="qr">${qrSvg(link)}Scan to shop &mdash;<br />code applies for you</div>
        </div>
        <div class="fine">Enter the code in the cart, or scan the QR code. One use per code${untilText ? `, good until ${esc(untilText)}` : ""}. Can't be combined with other sales (the best discount applies).</div>
        <div class="foot">www.vintageplay.ca</div>
      </div>`;
  }

  const sheets = [];
  for (let i = 0; i < codes.length; i += 6) sheets.push(codes.slice(i, i + 6));
  document.getElementById("sheets").innerHTML = sheets.map((group) => `<div class="sheet">${group.map(card).join("")}</div>`).join("");
  if (isSample) {
    document.getElementById("help").innerHTML = "<strong>SAMPLE</strong> &mdash; this code is not real. Make real flyers from the Thank-You Coupons section of the admin page. " + document.getElementById("help").innerHTML;
    document.title = "Thank-you flyer (sample)";
  } else {
    document.title = `Thank-you flyers (${codes.length})`;
  }
</script>
</body>
</html>
